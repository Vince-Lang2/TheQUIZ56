<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Research Defense | Ballad is Watching</title>

<style>

  @media(max-width:600px){

body{
align-items:flex-start;

}

  window.submitAnswer = async function(){

const btn = document.querySelector("#submitBtn");

if(!answer.value.trim()){
alert("Write your answer");
return;
}

btn.innerText="Saving...";
btn.disabled=true;


try{

await addDoc(collection(db,"responses"),{

name:participant,

group:questions[current][0],

question:questions[current][1],

answer:answer.value,

expectedAnswer:questions[current][2],

timestamp:serverTimestamp()

});


status.innerText="✓ Saved Successfully";

);

*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{
margin:0;min-height:100vh;color:white;display:flex;
align-items:center;justify-content:center;
background:
radial-gradient(circle at top,#2563eb55,transparent 35%),
radial-gradient(circle at bottom,#9333ea55,transparent 35%),
#020617;
}
.card{
width:min(95%,900px);
padding:35px;
border-radius:30px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.2);
box-shadow:0 25px 80px #0008;
}
h1{text-align:center;font-size:42px;background:linear-gradient(90deg,#38bdf8,#facc15);-webkit-background-clip:text;color:transparent}
input,textarea{
width:100%;padding:16px;margin-top:15px;
border-radius:15px;background:#ffffff18;color:white;
border:1px solid #ffffff33;
}
textarea{height:180px}
button{
width:100%;padding:16px;margin-top:15px;border:0;
border-radius:15px;background:linear-gradient(90deg,#2563eb,#06b6d4);
color:white;font-weight:bold;cursor:pointer
}
.hidden{display:none}

.question{
padding:25px;background:#ffffff12;border-radius:20px;
font-size:22px;line-height:1.5;margin-top:20px
}

.admin-btn{
position:fixed;right:20px;bottom:20px;
width:45px;height:45px;border-radius:50%;
background:#ffffff22;display:flex;align-items:center;
justify-content:center;cursor:pointer;
}

.modal,.dashboard{
display:none;position:fixed;inset:0;
background:#020617ee;padding:30px;overflow:auto;
z-index:10;
}

.panel{
max-width:900px;margin:auto;padding:30px;
background:#ffffff12;border-radius:25px;
backdrop-filter:blur(20px);
}

.response{
background:white;color:#111;padding:20px;
border-radius:15px;margin:15px 0;
}
</style>
</head>

<body>
  <button id="submitBtn" onclick="submitAnswer()">
Submit Answer
</button>

<div class="card" id="home">
<h1>⚔️ Research Defense</h1>
<h2 style="text-align:center">"Ballad is Watching"</h2>
<p style="text-align:center">Research Defense System</p>

<input id="name" placeholder="Enter your name">
<button onclick="start()">Begin Defense</button>
</div>


<div class="card hidden" id="game">

<h3 id="counter"></h3>
<p id="group"></p>

<div class="question" id="question"></div>

<textarea id="answer" placeholder="Write your defense answer"></textarea>

<button onclick="submitAnswer()">Submit Answer</button>

<button id="next" class="hidden" onclick="nextQuestion()">Next Question →</button>

<p id="status"></p>

</div>


<div class="admin-btn" onclick="openAdmin()">🔒</div>


<div class="modal" id="adminLogin">

<div class="panel">
<h2>🔐 Admin Login</h2>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

</div>


<div class="dashboard" id="dashboard">

<div class="panel">

<h1>Admin Dashboard</h1>

<button onclick="logout()">Logout</button>

<div id="responses"></div>

</div>

</div>


<script type="module">
  window.submitAnswer = async function(){

const btn = document.querySelector("#submitBtn");

if(!answer.value.trim()){
alert("Write your answer");
return;
}

btn.innerText="Saving...";
btn.disabled=true;


try{

await addDoc(collection(db,"responses"),{

name:participant,

group:questions[current][0],

question:questions[current][1],

answer:answer.value,

expectedAnswer:questions[current][2],

timestamp:serverTimestamp()

});


status.innerText="✓ Saved Successfully";

next.classList.remove("hidden");


}

catch(error){

alert(
"Firebase Error:\n"+error.message
);

console.error(error);

}


btn.innerText="Submit Answer";
btn.disabled=false;

}

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {
apiKey:"AIzaSyBIRD2jWCkb-lxD6mCAjMNU8zb-I0JHCFs",
authDomain:"quiz1-e0a41.firebaseapp.com",
projectId:"quiz1-e0a41",
storageBucket:"quiz1-e0a41.firebasestorage.app",
messagingSenderId:"245626532563",
appId:"1:245626532563:web:9f41796d2d3a3c89641a26",
measurementId:"G-0STRYLKRR2"
};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


const questions=[
["Research Rationale","Why did your study consider attitudes toward AI as a possible predictor of AI ethical awareness?","Students’ cognitive beliefs, emotional responses, and behavioral tendencies toward AI may influence ethical evaluation."],
["Research Rationale","Why separate attitudes toward AI and ethical awareness?","Attitude describes beliefs, feelings, and behaviors while ethical awareness focuses on ethical recognition."],
["Literature Review","Why combine AI attitudes and ethics in one predictive model?","It determines whether attitude dimensions explain ethical awareness dimensions."],
["Framework","Why use the Tripartite Model of Attitude?","It explains cognition, affect, and behavior."],
["Methodology","Why choose predictive-correlational design?","It examines relationships without manipulating variables."],
["Statistics","Why can prediction not prove causation?","Statistical prediction does not establish cause and effect."]
];


let current=0;
let used=[];
let participant="";


window.start=function(){

participant=document.getElementById("name").value.trim();

if(!participant)return alert("Enter name");

home.classList.add("hidden");
game.classList.remove("hidden");

nextQuestion();

}


function nextQuestion(){

if(used.length===questions.length){
alert("Finished");
return;
}

do{
current=Math.floor(Math.random()*questions.length);
}
while(used.includes(current));

used.push(current);

group.innerText=questions[current][0];
counter.innerText="Question "+used.length;
question.innerText=questions[current][1];
answer.value="";
next.classList.add("hidden");

}


window.submitAnswer=async function(){

if(!answer.value.trim())
return alert("Write answer");

await addDoc(collection(db,"responses"),{

name:participant,
group:questions[current][0],
question:questions[current][1],
answer:answer.value,
expectedAnswer:questions[current][2],
timestamp:serverTimestamp()

});


status.innerText="✓ Saved to Firebase";

next.classList.remove("hidden");

}


window.nextQuestion=nextQuestion;


window.openAdmin=function(){
adminLogin.style.display="block";
}


window.login=async function(){

if(password.value!=="2312312312315")
return alert("Wrong password");

adminLogin.style.display="none";
dashboard.style.display="block";

responses.innerHTML="";

const snap=await getDocs(collection(db,"responses"));

snap.forEach(doc=>{

let x=doc.data();

responses.innerHTML+=`

<div class="response">

<b>${x.name}</b><br><br>

Question:<br>${x.question}<br><br>

Answer:<br>${x.answer}<br><br>

Expected:<br>${x.expectedAnswer}

</div>`;

});

}


window.logout=function(){

dashboard.style.display="none";

}

</script>

</body>
</html>
